name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            artifact_name: better-screenshots-linux-x86_64
          - platform: linux-aarch64
            artifact_name: better-screenshots-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Build standalone binary (linux-x86_64)
        if: matrix.platform == 'linux-x86_64'
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name better-screenshots better_screenshots/main.py
        shell: bash

      - name: Build standalone binary (linux-aarch64)
        if: matrix.platform == 'linux-aarch64'
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name better-screenshots better_screenshots/main.py
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/better-screenshots
          retention-days: 5

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/better-screenshots
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*/better-screenshots
            dist/*/*.whl
            dist/*/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
